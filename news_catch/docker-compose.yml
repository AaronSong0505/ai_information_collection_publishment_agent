version: '3.8'

services:
  news-catch:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/news_catch.db
      - IMAGE_STORAGE_PATH=/app/data/images
      - PORT=3000
      - ENABLE_CACHE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3